[defaults]
# Points at the inventory/ directory, not the generated file directly, so
# Ansible's group_vars/host_vars auto-discovery finds inventory/group_vars/
# alongside it. inventory/hosts.yml is a symlink to ../build/dc1-inventory.yml
# (the file nb-playbooks/export-model.yml actually generates) so build/ stays
# the single source of truth.
inventory = inventory/
host_key_checking = False
deprecation_warnings = False
vault_password_file = .vault_pass
