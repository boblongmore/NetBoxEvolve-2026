---
- name: Render eos_designs inventory vars from the NetBox-exported model
  hosts: localhost
  gather_facts: false

  tasks:
    # nb-playbooks owns all NetBox credentials and read logic (see its own
    # README/CLAUDE.md for why) -- this shells out to it rather than
    # duplicating that logic or giving avd-playbooks its own NetBox
    # access, so an operator never has to cd into nb-playbooks by hand.
    # It always reports changed: nb-playbooks/export-model.yml stamps
    # build/*.yml with a fresh export timestamp on every run.
    - name: Export the fabric model from NetBox
      ansible.builtin.command:
        cmd: ansible-playbook export-model.yml
        chdir: "{{ playbook_dir }}/../nb-playbooks"
      changed_when: true

    - name: Load the exported fabric model
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../build/dc1-model.yml"
        name: dc1_model

    - name: AVD input vars
      ansible.builtin.include_role:
        name: avd_inputs
