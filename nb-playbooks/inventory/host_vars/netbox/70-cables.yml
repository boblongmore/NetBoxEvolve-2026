---
# The entire DC1 and DC2 topologies: 8 underlay links + 2 peer-link
# members each. Uplinks and peer-links are read back from this cable
# graph by every renderer -- never hand-listed a second time anywhere
# else. No per-site filtering needed here (unlike 60-devices.yml) --
# device names are already globally unique, and netbox_cable/
# netbox_device_interface calls take names directly, not site-scoped
# role defaults.
cables:
  - kind: underlay
    a: {device: dc1-leaf1, interface: Ethernet1}
    b: {device: dc1-spine1, interface: Ethernet1}
  - kind: underlay
    a: {device: dc1-leaf1, interface: Ethernet2}
    b: {device: dc1-spine2, interface: Ethernet1}
  - kind: underlay
    a: {device: dc1-leaf2, interface: Ethernet1}
    b: {device: dc1-spine1, interface: Ethernet2}
  - kind: underlay
    a: {device: dc1-leaf2, interface: Ethernet2}
    b: {device: dc1-spine2, interface: Ethernet2}
  - kind: underlay
    a: {device: dc1-leaf3, interface: Ethernet1}
    b: {device: dc1-spine1, interface: Ethernet3}
  - kind: underlay
    a: {device: dc1-leaf3, interface: Ethernet2}
    b: {device: dc1-spine2, interface: Ethernet3}
  - kind: underlay
    a: {device: dc1-leaf4, interface: Ethernet1}
    b: {device: dc1-spine1, interface: Ethernet4}
  - kind: underlay
    a: {device: dc1-leaf4, interface: Ethernet2}
    b: {device: dc1-spine2, interface: Ethernet4}
  - kind: peer_link
    a: {device: dc1-leaf1, interface: Ethernet7}
    b: {device: dc1-leaf2, interface: Ethernet7}
  - kind: peer_link
    a: {device: dc1-leaf1, interface: Ethernet8}
    b: {device: dc1-leaf2, interface: Ethernet8}

  - kind: underlay
    a: {device: dc2-leaf1, interface: Ethernet1/1}
    b: {device: dc2-spine1, interface: Ethernet1/1}
  - kind: underlay
    a: {device: dc2-leaf1, interface: Ethernet1/2}
    b: {device: dc2-spine2, interface: Ethernet1/1}
  - kind: underlay
    a: {device: dc2-leaf2, interface: Ethernet1/1}
    b: {device: dc2-spine1, interface: Ethernet1/2}
  - kind: underlay
    a: {device: dc2-leaf2, interface: Ethernet1/2}
    b: {device: dc2-spine2, interface: Ethernet1/2}
  - kind: underlay
    a: {device: dc2-leaf3, interface: Ethernet1/1}
    b: {device: dc2-spine1, interface: Ethernet1/3}
  - kind: underlay
    a: {device: dc2-leaf3, interface: Ethernet1/2}
    b: {device: dc2-spine2, interface: Ethernet1/3}
  - kind: underlay
    a: {device: dc2-leaf4, interface: Ethernet1/1}
    b: {device: dc2-spine1, interface: Ethernet1/4}
  - kind: underlay
    a: {device: dc2-leaf4, interface: Ethernet1/2}
    b: {device: dc2-spine2, interface: Ethernet1/4}
  - kind: peer_link
    a: {device: dc2-leaf1, interface: Ethernet1/7}
    b: {device: dc2-leaf2, interface: Ethernet1/7}
  - kind: peer_link
    a: {device: dc2-leaf1, interface: Ethernet1/8}
    b: {device: dc2-leaf2, interface: Ethernet1/8}

# Port-Channel1 bundles the peer-link members on both MLAG peers.
lag_interfaces:
  - device: dc1-leaf1
    name: Port-Channel1
    members: [Ethernet7, Ethernet8]
  - device: dc1-leaf2
    name: Port-Channel1
    members: [Ethernet7, Ethernet8]
  - device: dc2-leaf1
    name: Port-Channel1
    members: [Ethernet1/7, Ethernet1/8]
  - device: dc2-leaf2
    name: Port-Channel1
    members: [Ethernet1/7, Ethernet1/8]
