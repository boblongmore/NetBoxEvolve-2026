---
# Manufacturer, platform and device type all already exist in this NetBox
# instance (from the netbox_configure/avd-poc project) with zero interface
# templates defined on the device type. Reusing them rather than creating
# near-duplicates: "cEOS" / "ceos" is the same physical/software reality
# either project would model. "Cisco" manufacturer already exists too;
# nxos platform and the N9K device type are new.
manufacturers:
  - name: Arista
  - name: Cisco

platforms:
  - name: ceos
    manufacturer: Arista
  - name: nxos
    manufacturer: Cisco

device_types:
  - model: cEOS
    manufacturer: Arista
    u_height: 1
  - model: N9K-C93180YC-EX
    manufacturer: Cisco
    u_height: 1

# One device type carries interfaces for every device that uses it --
# NetBox instantiates these automatically when a device is created, so no
# per-device interface list is needed anywhere in this project.
interface_templates:
  - device_type: cEOS
    name: Management0
    type: 1000base-t
    mgmt_only: true
  - device_type: cEOS
    name: Ethernet1
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet2
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet3
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet4
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet5
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet6
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet7
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Ethernet8
    type: 10gbase-x-sfpp
  - device_type: cEOS
    name: Loopback0
    type: virtual
  - device_type: cEOS
    name: Loopback1
    type: virtual

  # N9K-C93180YC-EX -- real Nexus interface naming (Ethernet1/N, mgmt0),
  # even though DC2 is never actually deployed. Same 8-uplink shape as
  # DC1's cEOS so the two device types stay directly comparable.
  - device_type: N9K-C93180YC-EX
    name: mgmt0
    type: 1000base-t
    mgmt_only: true
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/1
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/2
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/3
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/4
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/5
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/6
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/7
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Ethernet1/8
    type: 10gbase-x-sfpp
  - device_type: N9K-C93180YC-EX
    name: Loopback0
    type: virtual
  - device_type: N9K-C93180YC-EX
    name: Loopback1
    type: virtual
