---
tenants:
  - name: TENANT1
    description: Demo tenant carried by the fabric's L2/L3 services.

# Named netbox_tags, not tags -- "tags" is an Ansible-reserved name (task
# tag filtering) and using it as a plain variable causes exactly the kind
# of ambiguity that shows up as a "Found variable using reserved name"
# warning the moment anyone runs this playbook with --tags.
netbox_tags:
  - name: svc-tenant1
    color: "2196f3"
    description: Marks the VRF, VLANs and devices that carry TENANT1 services.
  # Already exists in this NetBox instance from the netbox_configure project;
  # values below match its current color/description exactly so this task
  # stays a no-op rather than fighting over ownership of a shared tag.
  - name: managed-by-ansible
    color: "0000ff"
    description: ""
