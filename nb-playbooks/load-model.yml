---
- name: Load the DC1 (Arista) and DC2 (Cisco) data model into NetBox
  hosts: netbox
  gather_facts: false

  module_defaults:
    group/netbox.netbox.netbox:
      netbox_url: "{{ netbox_api }}"
      netbox_token: "{{ netbox_token }}"
      validate_certs: false

  tasks:
    - name: Custom fields
      ansible.builtin.include_role:
        name: custom_fields
      tags: custom_fields

    - name: Tenancy (tenants, tags)
      ansible.builtin.include_role:
        name: tenancy
      tags: tenancy

    - name: Sites and racks
      ansible.builtin.include_role:
        name: sites
      tags: sites

    - name: Device types (manufacturer, platform, device type, interface templates)
      ansible.builtin.include_role:
        name: device_types
      tags: device_types

    - name: Device roles
      ansible.builtin.include_role:
        name: device_roles
      tags: device_roles

    - name: IPAM (ASN, prefix roles, prefix pools)
      ansible.builtin.include_role:
        name: ipam
      tags: ipam

    - name: Overlay (VLAN groups, VLANs, VRF, service prefixes)
      ansible.builtin.include_role:
        name: overlay
      tags: overlay

    # devices' own defaults already match DC1 (cEOS/Management0/dc1-r01);
    # DC2 needs every one of them overridden, plus its own device subset.
    # hostvars[inventory_hostname].devices, not the bare "devices", because
    # "devices: {{ devices | selectattr(...) }}" recurses infinitely --
    # Ansible resolves the RHS against this same vars: block, not the
    # outer host var, once a key of that name is being (re)defined here.
    - name: Devices (DC1)
      ansible.builtin.include_role:
        name: devices
      vars:  # noqa: var-naming[no-role-prefix] -- overriding the global vars, not naming new data
        devices: "{{ hostvars[inventory_hostname].devices
                      | selectattr('site', 'equalto', 'dc1') | list }}"
        mlag_vtep_vips: "{{ hostvars[inventory_hostname].mlag_vtep_vips
                             | selectattr('site', 'equalto', 'dc1') | list }}"
      tags: devices

    - name: Devices (DC2)
      ansible.builtin.include_role:
        name: devices
      vars:  # noqa: var-naming[no-role-prefix] -- see the DC1 include above
        devices: "{{ hostvars[inventory_hostname].devices
                      | selectattr('site', 'equalto', 'dc2') | list }}"
        mlag_vtep_vips: "{{ hostvars[inventory_hostname].mlag_vtep_vips
                             | selectattr('site', 'equalto', 'dc2') | list }}"
        devices_site: dc2
        devices_rack: dc2-r01
        devices_device_type: N9K-C93180YC-EX
        devices_platform: nxos
        devices_mgmt_interface: mgmt0
      tags: devices

    - name: Cables
      ansible.builtin.include_role:
        name: cables
      tags: cables

    - name: Config contexts
      ansible.builtin.include_role:
        name: contexts
      tags: contexts
