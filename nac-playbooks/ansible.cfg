[defaults]
# Nexus as Code's whole data model lives under ONE host, named after the
# fabric itself (DC2) -- unlike AVD, it doesn't need a per-device
# inventory, so this is a plain static file, not something generated by
# nb-playbooks/export-model.yml.
inventory = inventory/
host_key_checking = False
deprecation_warnings = False
# cisco.nac_dc_vxlan 0.5.0's own "enhanced rules" optional-feature check
# (roles/validate/tasks/sub_main.yml) is `when: enhanced_rules_path is
# defined and enhanced_rules_path` -- when that var is an empty string
# rather than unset, this ansible-core version's stricter conditional
# type-checking rejects the non-boolean result outright. We don't use
# the enhanced-rules feature at all; this is Ansible's own documented
# escape hatch for exactly this kind of old-collection/new-engine
# mismatch, not a relaxation of anything this project's own code does.
allow_broken_conditionals = True
