---
# Rendered from https://blnetbox.lab.local (exported 2026-09-25T15:35:40Z).
# Do not hand-edit -- re-run nb-playbooks/export-model.yml then
# nac-playbooks/render-nac-vars.yml instead.
vxlan:
  fabric:
    name: DC2
    type: VXLAN_EVPN

  global:
    ibgp:
      bgp_asn: "65002"
      route_reflectors: 2
      anycast_gateway_mac: "00:1c:73:00:dc:01"
      layer2_vni_range: {from: 10000, to: 19999}
      layer3_vni_range: {from: 50000, to: 59999}
      vpc:
        peer_link_vlan: 3600
        peer_keep_alive: management
        auto_recovery_time: 360
        peer_link_port_channel_id: 1

  topology:
    switches:
      - name: dc2-spine1
        serial_number: DEMO0000007
        role: spine
        management:
          management_ipv4_address: 172.20.22.11
          subnet_mask_ipv4: 24
          default_gateway_v4: 172.20.22.1
      - name: dc2-spine2
        serial_number: DEMO0000008
        role: spine
        management:
          management_ipv4_address: 172.20.22.12
          subnet_mask_ipv4: 24
          default_gateway_v4: 172.20.22.1
      - name: dc2-leaf1
        serial_number: DEMO0000009
        role: leaf
        management:
          management_ipv4_address: 172.20.22.13
          subnet_mask_ipv4: 24
          default_gateway_v4: 172.20.22.1
      - name: dc2-leaf2
        serial_number: DEMO0000010
        role: leaf
        management:
          management_ipv4_address: 172.20.22.14
          subnet_mask_ipv4: 24
          default_gateway_v4: 172.20.22.1
      - name: dc2-leaf3
        serial_number: DEMO0000011
        role: leaf
        management:
          management_ipv4_address: 172.20.22.15
          subnet_mask_ipv4: 24
          default_gateway_v4: 172.20.22.1
      - name: dc2-leaf4
        serial_number: DEMO0000012
        role: leaf
        management:
          management_ipv4_address: 172.20.22.16
          subnet_mask_ipv4: 24
          default_gateway_v4: 172.20.22.1

    vpc_peers:
      - peer1: dc2-leaf1
        peer1_peerlink_interfaces:
          - name: Ethernet1/7
          - name: Ethernet1/8
        peer2: dc2-leaf2
        peer2_peerlink_interfaces:
          - name: Ethernet1/7
          - name: Ethernet1/8
        domain_id: 1
        fabric_peering: false
        vtep_vip: "10.2.1.101"

    fabric_links:
      - source_device: dc2-leaf1
        source_interface: Ethernet1/1
        dest_device: dc2-spine1
        dest_interface: Ethernet1/1
      - source_device: dc2-leaf1
        source_interface: Ethernet1/2
        dest_device: dc2-spine2
        dest_interface: Ethernet1/1
      - source_device: dc2-leaf2
        source_interface: Ethernet1/1
        dest_device: dc2-spine1
        dest_interface: Ethernet1/2
      - source_device: dc2-leaf2
        source_interface: Ethernet1/2
        dest_device: dc2-spine2
        dest_interface: Ethernet1/2
      - source_device: dc2-leaf3
        source_interface: Ethernet1/1
        dest_device: dc2-spine1
        dest_interface: Ethernet1/3
      - source_device: dc2-leaf3
        source_interface: Ethernet1/2
        dest_device: dc2-spine2
        dest_interface: Ethernet1/3
      - source_device: dc2-leaf4
        source_interface: Ethernet1/1
        dest_device: dc2-spine1
        dest_interface: Ethernet1/4
      - source_device: dc2-leaf4
        source_interface: Ethernet1/2
        dest_device: dc2-spine2
        dest_interface: Ethernet1/4

  underlay:
    general:
      routing_protocol: ospf
      replication_mode: ingress
      intra_fabric_interface_mtu: 9214
    ipv4:
      fabric_interface_numbering: p2p
      subnet_mask: 31
      underlay_routing_loopback_ip_range: 10.2.0.0/24
      underlay_vtep_loopback_ip_range: 10.2.1.0/24
      underlay_subnet_ip_range: 10.2.2.0/24
    ospf:
      area_id: 0.0.0.0

  # Symmetric IRB via EVPN doesn't need a per-VRF transport SVI on the AVD
  # side, but Nexus as Code does -- vrfs[].vlan_id is the one place the
  # L3VNI placeholder VLAN in NetBox (TENANT1-L3VNI, vid 2001) actually
  # gets used.
  overlay:
    vrfs:
      - name: TENANT1
        vrf_id: 50001
        vlan_id: 2001
        vrf_attach_group: ALL_LEAF

    vrf_attach_groups:
      - name: ALL_LEAF
        switches:
          - hostname: dc2-leaf1
          - hostname: dc2-leaf2
          - hostname: dc2-leaf3
          - hostname: dc2-leaf4

    networks:
      - name: TENANT1-APP
        vrf_name: TENANT1
        net_id: 10110
        vlan_id: 110
        vlan_name: TENANT1-APP
        gw_ip_address: "10.20.110.1/24"
        network_attach_group: ALL_LEAF
      - name: TENANT1-WEB
        vrf_name: TENANT1
        net_id: 10120
        vlan_id: 120
        vlan_name: TENANT1-WEB
        gw_ip_address: "10.20.120.1/24"
        network_attach_group: ALL_LEAF

    network_attach_groups:
      - name: ALL_LEAF
        switches:
          - hostname: dc2-leaf1
          - hostname: dc2-leaf2
          - hostname: dc2-leaf3
          - hostname: dc2-leaf4
